name: Beta release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        default: v0.6.1-beta
  push:
    tags: ["v*-beta*"]
    # Editing this file on beta requests a beta release; it holds the tag to create.
    branches: [beta]
    paths: [".github/release-beta.txt"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then tag="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"
          else tag=$(head -n1 .github/release-beta.txt | tr -d '[:space:]'); fi
          case "$tag" in v*-beta*) ;; *) echo "Refusing non-beta tag '$tag'"; exit 1;; esac
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Compile-time and test-server dependencies only; they are not bundled into the bridge or the release.
      - name: Fetch tested Overgrown Apoli and Origins
        run: python3 .github/scripts/fetch_overgrown.py

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Compatibility suite (isolated loopback test server)
        run: ./gradlew verifyCompatibility --no-daemon

      # The Gradle run uses Mojang names throughout. Released jars run with intermediary names, so mixin
      # selectors that only match in development would pass above and crash players. This boots the built
      # jar with the Overgrown jars on a real Fabric server and runs the same suite there.
      - name: Compatibility suite (production-mapped server)
        run: |
          set -euo pipefail
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          version=$(prop mod_version); mc=$(prop minecraft_version); loader=$(prop loader_version); fapi=$(prop fabric_api_version)
          installer=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | python3 -c "import json,sys; print(next(v['version'] for v in json.load(sys.stdin) if v['stable']))")
          run=build/production-run
          rm -rf "$run"; mkdir -p "$run/mods" "$run/tests"
          curl -fsSL -o "$run/server.jar" "https://meta.fabricmc.net/v2/versions/loader/$mc/$loader/$installer/server/jar"
          curl -fsSL -o "$run/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$fapi/fabric-api-$fapi.jar"
          cp libs/apoli.jar libs/origins.jar "build/libs/overgrown-legacy-bridge-$version.jar" "$run/mods/"
          cp tests/upstream-codec-corpus.json "$run/tests/"
          printf 'eula=true\n' > "$run/eula.txt"
          printf 'server-ip=127.0.0.1\nserver-port=25580\nonline-mode=false\nlevel-name=world\nview-distance=2\nsimulation-distance=2\nmax-tick-time=-1\n' > "$run/server.properties"
          (cd "$run" && timeout 900 java -Xmx2G -Dovergrown_legacy_bridge.testCorpus=tests/upstream-codec-corpus.json -jar server.jar nogui < /dev/null > server.log 2>&1) || echo "Server exited with status $?"
          grep -E "COMPATIBILITY|BEHAVIORAL|REGRESSION|Mixin|mixin|Exception|Crash" "$run/server.log" | grep -v "Loaded .* mixin" | head -80 || true
          python3 - <<'PY'
          import json, os, sys
          base = "build/production-run/tests"
          missing = [f for f in ("codec-results.json", "regression-results.json") if not os.path.exists(os.path.join(base, f))]
          if missing:
              sys.exit(f"Production server produced no {missing}; see the log above (a mixin that fails to apply crashes startup).")
          codecs = [r for r in json.load(open(os.path.join(base, "codec-results.json"))) if not r.get("full")]
          regressions = json.load(open(os.path.join(base, "regression-results.json")))
          failed = [r["name"] for r in codecs if not r["passed"]] + [f"{r['name']}: {r.get('error')}" for r in regressions if not r["passed"]]
          print(f"production: codec {sum(r['passed'] for r in codecs)}/{len(codecs)}, regressions {sum(r['passed'] for r in regressions)}/{len(regressions)}")
          if failed:
              sys.exit("Production failures: " + "; ".join(failed))
          PY

      # Starts the released jar on a production-mapped Fabric client (virtual display), force-loads every mixin
      # target and closes. The servers above never apply client-only mixins. A development client cannot be used:
      # an Overgrown Apoli client mixin names its target in intermediary without a refmap.
      - name: Client mixin audit (production-mapped client)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          version=$(prop mod_version); mc=$(prop minecraft_version); loader=$(prop loader_version); fapi=$(prop fabric_api_version)
          run=build/client-run
          rm -rf "$run"; mkdir -p "$run/mods"
          curl -fsSL -o "$run/mods/fabric-api.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$fapi/fabric-api-$fapi.jar"
          cp libs/apoli.jar libs/origins.jar "build/libs/overgrown-legacy-bridge-$version.jar" "$run/mods/"
          LIBGL_ALWAYS_SOFTWARE=1 timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 .github/scripts/launch_client.py "$run" "$mc" "$loader" -Dovergrown_legacy_bridge.auditMixins=true \
            > build/client-run.log 2>&1 || echo "Client exited with status $?"
          grep -iE "overgrown_legacy_bridge|org\.overgrowns|mixin.*(error|fail)|Injection|Exception|Launching" build/client-run.log | grep -v "WorldSlice" | head -60 || true
          test -f "$run/mixin-audit.txt" || { tail -80 build/client-run.log; echo "The client produced no mixin audit result"; exit 1; }
          cat "$run/mixin-audit.txt"
          grep -qx passed "$run/mixin-audit.txt"

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          if os.path.exists("tests/codec-results.json"):
              rows = json.load(open("tests/codec-results.json"))
              base = [r for r in rows if not r.get("full")]
              full = [r for r in rows if r.get("full")]
              print(f"codec: {sum(r['passed'] for r in base)}/{len(base)} passed; failures: {[r['name'] for r in base if not r['passed']]}")
              print(f"full-field: {sum(r.get('decoded', False) for r in full)}/{len(full)} decoded")
              for r in full:
                  if r.get("ignored_fields"): print(f"  ignored {r['name']}: {r['ignored_fields']}")
                  if not r.get("decoded"): print(f"  undecoded {r['name']}: {r.get('error', '')[:200]}")
          if os.path.exists("tests/regression-results.json"):
              rows = json.load(open("tests/regression-results.json"))
              print(f"regressions: {sum(r['passed'] for r in rows)}/{len(rows)} passed")
              for r in rows:
                  if not r["passed"]: print(f"  FAILED {r['name']}: {r.get('error')}")
          PY

      - name: Package
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar="build/libs/overgrown-legacy-bridge-${version}.jar"
          test -f "$jar"
          stage="build/release/overgrown-legacy-bridge-${TAG#v}"
          mkdir -p "$stage"
          cp "$jar" "$stage/"
          (cd overrides && zip -qr "../$stage/allaykin-item-fix-datapack.zip" pack.mcmeta data)
          cp README.md COMPATIBILITY.md SUMMARY.md LICENSE "$stage/"
          cat > "$stage/INSTALL.txt" <<TXT
          Overgrown Legacy Bridge ${version} (${TAG})

          1. Remove any older overgrown-legacy-bridge jar from the server and every client.
          2. Copy overgrown-legacy-bridge-${version}.jar into the mods folder of the server AND every client.
          3. Keep Minecraft 1.20.1, Fabric Loader 0.19.3+, Fabric API, Overgrown Apoli 1.90.0+
             and Overgrown Origins 1.41.0+ installed, then restart.
          4. Optional: only for the Allaykin pack, put allaykin-item-fix-datapack.zip in the world's
             datapacks folder, enable it after Allaykin, and run /reload.
          5. After startup or /reload, check config/overgrown_legacy_bridge/compatibility-report.json
             (/legacybridge report shows its location).
          TXT
          (cd build/release && zip -qr "overgrown-legacy-bridge-${TAG#v}.zip" "overgrown-legacy-bridge-${TAG#v}")
          mkdir -p build/release/assets
          cp "$jar" "build/release/overgrown-legacy-bridge-${TAG#v}.zip" build/release/assets/
          ls -la build/release/assets

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-and-test-results
          path: |
            build/release/assets/
            tests/*.json
            build/production-run/tests/*-results.json
            build/production-run/server.log
            build/client-run.log

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Overgrown Legacy Bridge ${{ env.TAG }}
          prerelease: true
          body_path: .github/release-notes-beta.md
          files: build/release/assets/*
